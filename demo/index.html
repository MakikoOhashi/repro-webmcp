<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repro Demo</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f6fb; }
      body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
      main { width: min(680px, calc(100% - 32px)); background: white; padding: 32px; border-radius: 16px; box-shadow: 0 12px 40px #1c2a4a18; }
      h1 { margin-top: 0; }
      .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #e8eefc; color: #3157a4; font-size: 13px; font-weight: 700; }
      dl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      dt { color: #667085; } dd { margin: 0; font-weight: 700; }
      #status { margin-top: 24px; color: #667085; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">REPRO DEMO</span>
      <h1>Account overview</h1>
      <p id="message">Default application state</p>
      <dl>
        <dt>Plan</dt><dd id="plan">—</dd>
        <dt>Subscription</dt><dd id="subscription_status">—</dd>
        <dt>Usage</dt><dd><span id="usage_count">—</span> / 10</dd>
      </dl>
      <p id="status">Loading Repro WebMCP tools…</p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
